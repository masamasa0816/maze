<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>めいろ大冒険</title>
<style>
html,body{margin:0;height:100%;background:#16213e;color:#fff;font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
canvas{width:min(98vw,880px,calc(66vh*880/600));aspect-ratio:880/600;border-radius:14px;box-shadow:0 6px 24px #0008;cursor:pointer;background:#000}
#pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:6px}
#pad button,#mute{font:inherit;font-size:26px;border:0;border-radius:14px;background:#ffd23f;color:#16213e;box-shadow:0 4px #c79a00}
#pad button:active{transform:translateY(3px);box-shadow:0 1px #c79a00}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
#mute{font-size:14px;padding:6px 14px;margin-left:12px}
#help{font-size:13px;opacity:.8;display:flex;align-items:center}
@media (hover:hover) and (pointer:fine){#pad{display:none}}
</style></head><body>
<canvas id="c"></canvas>
<div id="pad"><button class="u" data-d="u">▲</button><button class="l" data-d="l">◀</button><button class="d" data-d="d">▼</button><button class="r" data-d="r">▶</button></div>
<div id="help">うごかす: 矢印キー / WASD　つぎへ: Enter・クリック<button id="mute">おんがく: ON</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=880,H=600;cv.width=W;cv.height=H;
const FONT='"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif';
const D4=[[1,0],[-1,0],[0,1],[0,-1]],DV={l:[-1,0],r:[1,0],u:[0,-1],d:[0,1]};
const rand=(a,b)=>a+Math.random()*(b-a);
/* ---------- 音 ---------- */
let AC=null,muted=false,bgmOn=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='square',v=.07,t0=0,slide){const a=AC;if(!a||muted)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const N={C4:262,F4:349,G4:392,E4:330,A4:440,C5:523,D5:587,E5:659,F5:698,G5:784,A5:880,C6:1047};
const seq=(n,s,ty,v)=>n.forEach((x,i)=>{if(x)tone(N[x],s*.95,ty,v,i*s)});
const fanfare=()=>{seq(['G4','C5','E5','G5',0,'E5','G5','C6'],.14,'square',.07);seq(['C4',0,'E4',0,'G4',0,'C5'].map(x=>x==='C4'?'C4':x),.14,'triangle',.08)};
N.C4=262;
function bigMusic(){const m=['C5','E5','G5','C6','G5','E5','G5','C6','A5','F5','A5','C6','G5','E5','D5','C5','D5','E5','G5','E5','C5','D5','E5','G5','C6',0,'G5','C6'];seq(m,.18,'square',.06);seq(m.map((n,i)=>i%4===0?['C4','F4','G4','C4'][(i/4|0)%4]:0),.18,'triangle',.1)}
const boom=()=>{tone(rand(140,300),.4,'sawtooth',.05,0,50);tone(rand(1200,2000),.12,'square',.03,.02,400)};
const grunt0=()=>{tone(160,.14,'sawtooth',.1,0,90);tone(140,.16,'sawtooth',.1,.22,80)};
let lastCall=-9;
function gcall(v){
  if(muted)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('ウホウホ');u.lang='ja-JP';u.pitch=0;u.rate=.85;u.volume=v;speechSynthesis.speak(u)}catch(e){}
  const a=AC;if(!a)return;
  [0,.4].forEach(o=>{const t0=a.currentTime+o,d=.32,osc=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain(),lf=a.createOscillator(),lg=a.createGain();
    osc.type='sawtooth';osc.frequency.setValueAtTime(100,t0);osc.frequency.linearRampToValueAtTime(68,t0+d);
    lf.frequency.value=26;lg.gain.value=9;lf.connect(lg);lg.connect(osc.frequency);
    f.type='bandpass';f.Q.value=2.5;f.frequency.setValueAtTime(300,t0);f.frequency.linearRampToValueAtTime(700,t0+.14);
    g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(1.5*v,t0+.05);g.gain.exponentialRampToValueAtTime(.001,t0+d);
    osc.connect(f);f.connect(g);g.connect(a.destination);osc.start(t0);lf.start(t0);osc.stop(t0+d+.05);lf.stop(t0+d+.05)})}
function reveal(){const r=S.vis;for(let y=Math.max(0,Math.floor(p.ry-r));y<=Math.min(S.R-1,Math.ceil(p.ry+r));y++)for(let x=Math.max(0,Math.floor(p.rx-r));x<=Math.min(S.C-1,Math.ceil(p.rx+r));x++)if(Math.hypot(x-p.rx,y-p.ry)<=r)S.seen[y][x]=true}
const bgm=['C5',0,'E5',0,'G5',0,'E5',0,'F5',0,'A5',0,'G5',0,'E5',0,'D5',0,'F5',0,'E5',0,'C5',0,'D5','E5','D5',0,'C5',0,0,0];let bi=0;
function startBgm(){if(bgmOn)return;bgmOn=true;setInterval(()=>{const n=bgm[bi++%bgm.length];if(n&&state==='play')tone(N[n],.2,'triangle',.045)},230)}
document.getElementById('mute').onclick=e=>{muted=!muted;e.target.textContent='おんがく: '+(muted?'OFF':'ON');e.target.blur()};
/* ---------- ステージ ---------- */
// [たて・よこ(セル), アイテム, ゴリラ, スライム, トゲ, シード, テーマ]
const ST=[[8,6,3,1,1,3,12,0],[9,6,4,2,1,4,23,1],[10,7,5,3,2,5,34,2],[11,7,5,4,2,6,45,3],[12,8,6,10,3,7,56,4],[14,9,8,20,4,9,67,5]];
const VIS=[4.4,4.1,3.8,3.5,3.3,3.1];
const TH=[{w:'#4a90e2',w2:'#2a5fa8',f1:'#fff6d6',f2:'#f6ebc0'},{w:'#4caf50',w2:'#2e7d32',f1:'#e8f5d0',f2:'#d9edb8'},{w:'#b36bd6',w2:'#7b3fa0',f1:'#fde8f4',f2:'#f8d6ea'},{w:'#e8903a',w2:'#a85a14',f1:'#fbe7bf',f2:'#f2d6a0'},{w:'#38b6c9',w2:'#1b7f90',f1:'#e4f8fb',f2:'#cdeff4'},{w:'#f5c518',w2:'#8a5a00',f1:'#2b1f4a',f2:'#35285a'}];
const HUD=56;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function build(i){
  const[w,h,ni,ng,nsl,nsp,seed,th]=ST[i],R=rng(seed),C=2*w+1,Rw=2*h+1;
  const g=Array.from({length:Rw},()=>Array(C).fill(1)),seen=Array.from({length:h},()=>Array(w).fill(false)),st=[[0,0]];
  g[1][1]=0;seen[0][0]=true;
  while(st.length){const[cx,cy]=st[st.length-1];const nb=D4.map(d=>[cx+d[0],cy+d[1],d]).filter(([x,y])=>x>=0&&y>=0&&x<w&&y<h&&!seen[y][x]);
    if(!nb.length){st.pop();continue}
    const[nx,ny,d]=nb[R()*nb.length|0];seen[ny][nx]=true;g[2*cy+1+d[1]][2*cx+1+d[0]]=0;g[2*ny+1][2*nx+1]=0;st.push([nx,ny])}
  let ex=Math.floor(w*h*.14);
  while(ex>0){const x=1+(R()*(C-2)|0),y=1+(R()*(Rw-2)|0);if(g[y][x]&&((x%2&&!(y%2))||(!(x%2)&&y%2))){g[y][x]=0;ex--}}
  const dist=Array.from({length:Rw},()=>Array(C).fill(-1));dist[1][1]=0;const q=[[1,1]];
  for(let k=0;k<q.length;k++){const[x,y]=q[k];for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy;if(!g[ny][nx]&&dist[ny][nx]<0){dist[ny][nx]=dist[y][x]+1;q.push([nx,ny])}}}
  const gx=C-2,gy=Rw-2,used=new Set(['1,1',gx+','+gy]);
  const pick=md=>{let c=q.filter(([x,y])=>dist[y][x]>=md&&!used.has(x+','+y));if(!c.length)c=q.filter(([x,y])=>!used.has(x+','+y));const[x,y]=c[R()*c.length|0];used.add(x+','+y);return[x,y]};
  const S={g,C,R:Rw,th,gx,gy,items:[],en:[],sp:[],got:0,flash:0,seen:Array.from({length:Rw},()=>Array(C).fill(false)),vis:VIS[i]};
  S.T=Math.min(W/C,(H-HUD-8)/Rw);S.ox=(W-C*S.T)/2;S.oy=HUD+(H-HUD-Rw*S.T)/2;
  for(let k=0;k<ni;k++){const[x,y]=pick(4);S.items.push({x,y,got:false})}
  const mk=(type,x,y)=>({type,rx:x,ry:y,tx:x,ty:y,dx:0,dy:0,talk:0,next:rand(2,6)});
  for(let k=0;k<ng;k++){const[x,y]=pick(Math.min(9,dist[gy][gx]*.4|0));const e=mk('g',x,y);e.sv=k%2===0;S.en.push(e)}
  for(let k=0;k<nsl;k++){const[x,y]=pick(8);S.en.push(mk('s',x,y))}
  for(let k=0;k<nsp;k++){const[x,y]=pick(5);S.sp.push({x,y,ph:rand(0,3)})}
  return S}
/* ---------- ゲーム状態 ---------- */
let state='title',stageI=0,lives=3,S,p,held=[],t=0,tm=0,grace=0,retry=false,fwT=0,endNext=0;
function begin(i,r){stageI=i;const old=r&&S&&S.vis?S.seen:null;S=build(i);if(old)S.seen=old;p={rx:1,ry:1,tx:1,ty:1,face:'d',walk:0};state='ready';tm=r?1.3:2.4;retry=!!r;reveal()}
function die(){if(state!=='play')return;state='dead';tm=1.5;lives--;tone(500,.6,'sawtooth',.1,0,90)}
function win(){state='clear';tm=0;fwT=0;fanfare();for(let k=0;k<4;k++)launch()}
function action(){ac();startBgm();
  if(state==='title'){lives=3;begin(0)}
  else if(state==='clear'&&tm>2){if(stageI<4)begin(stageI+1);else begin(5)}
  else if(state==='over'&&tm>1.2)state='title';
  else if(state==='ending'&&tm>4)state='title'}
cv.addEventListener('pointerdown',action);
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown',e=>{if(KM[e.code]){e.preventDefault();ac();const d=KM[e.code];if(!held.includes(d))held.push(d)}else if(e.code==='Enter'||e.code==='Space'){e.preventDefault();action()}});
addEventListener('keyup',e=>{const d=KM[e.code];if(d)held=held.filter(x=>x!==d)});
addEventListener('blur',()=>held=[]);
document.querySelectorAll('#pad button').forEach(b=>{const d=b.dataset.d;
  b.addEventListener('pointerdown',e=>{e.preventDefault();ac();if(!held.includes(d))held.push(d)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>held=held.filter(x=>x!==d)))});
/* ---------- 花火・紙ふぶき ---------- */
let fw=[],pt=[],cf=[];
function launch(){fw.push({x:rand(100,W-100),y:H,vy:-rand(380,520),ty:rand(90,300),c:`hsl(${rand(0,360)|0},100%,62%)`})}
function burst(x,y,c,n=44){for(let i=0;i<n;i++){const a=rand(0,6.283),s=rand(50,250);pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c})}}
function fxUpdate(dt){
  fw=fw.filter(r=>{r.y+=r.vy*dt;if(r.y<=r.ty){burst(r.x,r.y,r.c);boom();return false}return true});
  for(const a of pt){a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=150*dt;a.vx*=.99;a.l-=dt*.7}pt=pt.filter(a=>a.l>0);
  for(const c of cf){c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=dt*5}cf=cf.filter(c=>c.y<H+20)}
function fxDraw(){
  for(const c of cf){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.fillStyle=c.c;ctx.fillRect(-5,-3,10,6);ctx.restore()}
  for(const r of fw){ctx.fillStyle=r.c;ctx.beginPath();ctx.arc(r.x,r.y,3,0,7);ctx.fill()}
  for(const a of pt){ctx.globalAlpha=Math.max(0,a.l);ctx.fillStyle=a.c;ctx.beginPath();ctx.arc(a.x,a.y,2.6,0,7);ctx.fill()}ctx.globalAlpha=1}
/* ---------- 更新 ---------- */
function mv(o,sp,dt){const dx=o.tx-o.rx,dy=o.ty-o.ry,d=Math.hypot(dx,dy),s=sp*dt;if(d<=s){o.rx=o.tx;o.ry=o.ty;return false}o.rx+=dx/d*s;o.ry+=dy/d*s;return true}
function think(e){
  const opts=D4.filter(([dx,dy])=>!S.g[e.ty+dy][e.tx+dx]);let nz=opts.filter(([dx,dy])=>!(dx===-e.dx&&dy===-e.dy));if(!nz.length)nz=opts;let c;
  const dd=a=>Math.hypot(p.tx-e.tx-a[0],p.ty-e.ty-a[1]);
  if(e.type==='g'&&Math.hypot(p.tx-e.tx,p.ty-e.ty)<9&&Math.random()<.7)c=nz.reduce((a,b)=>dd(a)<=dd(b)?a:b);
  else if(e.type==='s'&&Math.random()<.88&&nz.some(o=>o[0]===e.dx&&o[1]===e.dy))c=[e.dx,e.dy];
  else c=nz[Math.random()*nz.length|0];
  e.dx=c[0];e.dy=c[1];e.tx+=c[0];e.ty+=c[1]}
const spState=k=>{const ph=(t+k.ph)%3;return ph>2.1?2:ph>1.6?1:0};
function update(dt){
  t+=dt;fxUpdate(dt);
  if(state==='ready'){tm-=dt;if(tm<=0){state='play';grace=1}}
  else if(state==='play'){
    grace-=dt;S.flash-=dt;
    if(p.rx===p.tx&&p.ry===p.ty&&held.length){const d=DV[held[held.length-1]];p.face=held[held.length-1];if(!S.g[p.ty+d[1]][p.tx+d[0]]){p.tx+=d[0];p.ty+=d[1]}}
    if(mv(p,5.3,dt))p.walk+=dt;reveal();
    for(const e of S.en){
      if(e.rx===e.tx&&e.ry===e.ty)think(e);
      mv(e,e.type==='g'?2.4+stageI*.2:2+stageI*.12,dt);
      if(e.type==='g'){e.next-=dt;e.talk=Math.max(0,e.talk-dt);if(e.next<=0){e.talk=1.3;e.next=rand(4,8);{const dd=Math.hypot(e.rx-p.rx,e.ry-p.ry);if(dd<14&&t-lastCall>.8){lastCall=t;gcall(Math.max(.15,Math.min(1,1.1-dd/12)))}}}}}
    for(const it of S.items)if(!it.got&&Math.hypot(it.x-p.rx,it.y-p.ry)<.5){it.got=true;S.got++;tone(880,.1,'square',.07);tone(1320,.15,'square',.07,.08);
      if(S.got===S.items.length){S.flash=2.2;seq(['E5','G5','C6'],.1,'square',.07)}}
    if(grace<=0){for(const e of S.en)if(Math.hypot(e.rx-p.rx,e.ry-p.ry)<.58)die();
      for(const k of S.sp)if(spState(k)===2&&Math.hypot(k.x-p.rx,k.y-p.ry)<.45)die()}
    if(state==='play'&&S.got===S.items.length&&Math.hypot(S.gx-p.rx,S.gy-p.ry)<.4){if(stageI<5)win();else{state='ending';tm=0;endNext=0;fwT=0}}
  }else if(state==='dead'){tm-=dt;if(tm<=0){if(lives>0)begin(stageI,1);else{state='over';tm=0;seq(['G4','E4','C4',0,'C4'],.3,'triangle',.1)}}}
  else if(state==='clear'){tm+=dt;fwT-=dt;if(fwT<=0){launch();fwT=.4}}
  else if(state==='over')tm+=dt;
  else if(state==='ending'){tm+=dt;fwT-=dt;if(fwT<=0){launch();fwT=.16}
    if(tm>=endNext){bigMusic();endNext+=5.6}
    if(Math.random()<.6)cf.push({x:rand(0,W),y:-10,vx:rand(-30,30),vy:rand(60,160),rot:rand(0,6),c:`hsl(${rand(0,360)|0},90%,60%)`})}
}
/* ---------- 描画ヘルパー ---------- */
const ell=(x,y,rx,ry,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()};
const rr=(x,y,w,h,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()};
function txt(s,x,y,size,col='#fff',stroke='#000',al='center'){ctx.font=`bold ${size}px ${FONT}`;ctx.textAlign=al;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=size/6;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y)}
function star(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,d=i%2?r*.45:r;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*d,y+Math.sin(a)*d)}ctx.closePath();ctx.fill();ctx.strokeStyle='#d99a00';ctx.lineWidth=2;ctx.stroke()}
function boy(x,y,s,face,wk,rot,crown){
  ctx.save();ctx.translate(x,y-Math.abs(Math.sin(wk*12))*s*.05);if(rot)ctx.rotate(rot);const l=Math.sin(wk*12)*s*.09;
  ell(0,s*.42,s*.3,s*.07,'rgba(0,0,0,.22)');
  rr(-s*.17+l,s*.22,s*.13,s*.2,s*.05,'#2c3e50');rr(s*.04-l,s*.22,s*.13,s*.2,s*.05,'#2c3e50');
  rr(-s*.22,-s*.02,s*.44,s*.3,s*.1,'#2e86de');
  ell(-s*.25,s*.1,s*.07,s*.07,'#ffd5b0');ell(s*.25,s*.1,s*.07,s*.07,'#ffd5b0');
  ell(0,-s*.17,s*.25,s*.23,'#ffd5b0');
  if(face!=='u'){const ox=face==='l'?-s*.06:face==='r'?s*.06:0;
    ell(-s*.09+ox,-s*.14,s*.035,s*.05,'#222');ell(s*.09+ox,-s*.14,s*.035,s*.05,'#222');
    ctx.strokeStyle='#c0392b';ctx.lineWidth=s*.025;ctx.beginPath();ctx.arc(ox,-s*.09,s*.06,.2,Math.PI-.2);ctx.stroke()}
  ctx.fillStyle=crown?'#ffd23f':'#e74c3c';ctx.beginPath();ctx.ellipse(0,-s*.26,s*.26,s*.17,0,Math.PI,2*Math.PI);ctx.fill();
  if(crown){ctx.beginPath();ctx.moveTo(-s*.2,-s*.28);ctx.lineTo(-s*.2,-s*.5);ctx.lineTo(-s*.1,-s*.38);ctx.lineTo(0,-s*.54);ctx.lineTo(s*.1,-s*.38);ctx.lineTo(s*.2,-s*.5);ctx.lineTo(s*.2,-s*.28);ctx.fill()}
  else if(face!=='u')rr(-s*.27+(face==='l'?-s*.08:face==='r'?s*.08:0),-s*.27,s*.54,s*.06,s*.03,'#b83227');
  ctx.restore()}
function gor(x,y,s,talk,cheer,sv){
  ctx.save();ctx.translate(x,y);
  const bt=Math.sin(t*3)*s*.012,ch=talk>0,beat=Math.sin(t*18)>0;
  ell(0,s*.45,s*.44,s*.08,'rgba(0,0,0,.3)');
  ell(-s*.17,s*.37,s*.14,s*.09,'#1a1512');ell(s*.17,s*.37,s*.14,s*.09,'#1a1512');
  const g=ctx.createRadialGradient(0,0,s*.05,0,s*.1,s*.46);g.addColorStop(0,'#4d4239');g.addColorStop(1,'#1d1815');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,s*.12+bt,s*.36,s*.32,0,0,7);ctx.fill();
  ell(0,s*.2+bt,s*.19,s*.15,'#2f2722');
  ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=s*.012;ctx.beginPath();
  for(let i=-6;i<=6;i++){ctx.moveTo(i*s*.055,Math.abs(i)*s*.01);ctx.lineTo(i*s*.055+i*s*.004,s*.1+Math.abs(i)*s*.012)}ctx.stroke();
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,-s*.06+bt,s*.4,s*.17,0,0,7);ctx.fill();
  if(sv){ctx.fillStyle='rgba(185,190,200,.5)';ctx.beginPath();ctx.ellipse(0,-s*.04+bt,s*.3,s*.1,0,0,7);ctx.fill()}
  const hy=-s*.2+bt;
  ell(-s*.2,hy+s*.02,s*.04,s*.05,'#241d19');ell(s*.2,hy+s*.02,s*.04,s*.05,'#241d19');
  ell(0,hy-s*.1,s*.12,s*.11,'#2c2420');ell(0,hy,s*.2,s*.18,'#2c2420');
  ell(0,hy+s*.02,s*.15,s*.14,'#15110f');
  ell(0,hy-s*.05,s*.17,s*.045,'#0b0908');
  for(const sg of[-1,1]){ell(sg*s*.065,hy-s*.012,s*.022,s*.016,'#a0682c');ell(sg*s*.065,hy-s*.012,s*.009,s*.009,'#000')}
  ell(0,hy+s*.07,s*.11,s*.075,'#3d322b');
  ell(-s*.035,hy+s*.05,s*.018,s*.012,'#0a0807');ell(s*.035,hy+s*.05,s*.018,s*.012,'#0a0807');
  if(ch){ell(0,hy+s*.115,s*.075,s*.03+Math.abs(Math.sin(t*14))*s*.025,'#4a0f12');rr(-s*.05,hy+s*.09,s*.1,s*.016,s*.004,'#f3ecd8')}
  else{ctx.strokeStyle='#0a0807';ctx.lineWidth=s*.014;ctx.beginPath();ctx.moveTo(-s*.06,hy+s*.11);ctx.lineTo(s*.06,hy+s*.11);ctx.stroke()}
  for(const sg of[-1,1]){
    const sx=sg*s*.36,sy=-s*.04+bt;let fx=sg*s*.44,fy=s*.3;
    if(cheer){fx=sg*s*.42;fy=-s*.3+Math.sin(t*10+sg)*s*.05}
    else if(ch&&((sg>0)===beat)){fx=sg*s*.1;fy=s*.14}
    ctx.lineCap='round';ctx.strokeStyle='#26201c';ctx.lineWidth=s*.2;ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(sg*s*.52,(sy+fy)/2,fx,fy);ctx.stroke();
    ell(fx,fy,s*.1,s*.09,'#15110f');for(let k=-1;k<=1;k++)ell(fx+k*s*.035,fy+s*.045,s*.014,s*.012,'#3a302a')}
  if(ch&&!cheer){const bw=s*1.5;rr(-bw/2,-s*1.0,bw,s*.38,s*.12,'#fff');ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-s*.08,-s*.63);ctx.lineTo(s*.04,-s*.63);ctx.lineTo(0,-s*.5);ctx.fill();
    ctx.font=`bold ${s*.24}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#b3261e';ctx.fillText('ウホウホ!',0,-s*.81)}
  ctx.restore()}
function slime(x,y,s){const q=Math.sin(t*6)*.05;ell(x,y+s*.3,s*.3,s*.06,'rgba(0,0,0,.2)');ell(x,y+s*.1,s*(.32+q),s*(.27-q),'#55d46b');ell(x-s*.1,y+s*.02,s*.12,s*.06,'#9af0a8');
  ell(x-s*.1,y+s*.08,s*.07,s*.08,'#fff');ell(x+s*.1,y+s*.08,s*.07,s*.08,'#fff');ell(x-s*.09,y+s*.1,s*.03,s*.04,'#111');ell(x+s*.11,y+s*.1,s*.03,s*.04,'#111')}
/* ---------- 描画 ---------- */
function drawGame(){
  const th=TH[S.th],T=S.T,ox=S.ox,oy=S.oy,fog=state==='play'||state==='ready'||state==='dead';
  ctx.fillStyle=fog?'#05060f':th.w2;ctx.fillRect(0,0,W,H);
  const sn=(x,y)=>!fog||S.seen[y][x],vis=(x,y)=>!fog||Math.hypot(x-p.rx,y-p.ry)<=S.vis+.3;
  for(let y=0;y<S.R;y++)for(let x=0;x<S.C;x++){if(!sn(x,y))continue;const X=ox+x*T,Y=oy+y*T;
    if(S.g[y][x]){rr(X,Y,T+1,T+1,T*.16,th.w2);rr(X+T*.05,Y+T*.03,T*.9,T*.84,T*.15,th.w)}
    else{ctx.fillStyle=(x+y)%2?th.f1:th.f2;ctx.fillRect(X,Y,T+1,T+1)}}
  const P=(x,y)=>[ox+(x+.5)*T,oy+(y+.5)*T],open=S.got===S.items.length;
  for(const k of S.sp){if(!sn(k.x,k.y))continue;const[X,Y]=P(k.x,k.y),s=spState(k);rr(X-T*.38,Y-T*.38,T*.76,T*.76,T*.1,'#6b6f7a');
    if(s===0){for(const dx of[-.18,.18])for(const dy of[-.18,.18])ell(X+dx*T,Y+dy*T,T*.04,T*.04,'#2d2f36')}
    else{const h=s===2?.34:.14;ctx.fillStyle=s===2?'#f1f3f7':(Math.sin(t*30)>0?'#ff6b6b':'#ffb3b3');
      for(const dx of[-.2,0,.2]){ctx.beginPath();ctx.moveTo(X+(dx-.09)*T,Y+.22*T);ctx.lineTo(X+dx*T,Y+(.22-h*2)*T);ctx.lineTo(X+(dx+.09)*T,Y+.22*T);ctx.fill()}}}
  if(sn(S.gx,S.gy)){const[X,Y]=P(S.gx,S.gy);ctx.save();ctx.translate(X,Y);
    if(open){ell(0,0,T*.46+Math.sin(t*6)*T*.03,T*.46,'#ffe066');rr(-T*.03,-T*.34,T*.06,T*.62,T*.02,'#7a4b1e');ctx.fillStyle='#ff3b3b';ctx.beginPath();ctx.moveTo(T*.03,-T*.34);ctx.lineTo(T*.34,-T*.22+Math.sin(t*8)*T*.03);ctx.lineTo(T*.03,-T*.1);ctx.fill()}
    else{rr(-T*.36,-T*.4,T*.72,T*.8,T*.12,'#8a8f9c');ctx.font=`${T*.45}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🔒',0,0)}
    ctx.restore()}
  for(const it of S.items)if(!it.got&&sn(it.x,it.y)){const[X,Y]=P(it.x,it.y);ell(X,Y+T*.32,T*.2,T*.05,'rgba(0,0,0,.2)');star(X,Y-Math.abs(Math.sin(t*4+it.x))*T*.08,T*.34,'#ffd23f')}
  for(const e of S.en){if(!vis(e.rx,e.ry))continue;const X=ox+(e.rx+.5)*T,Y=oy+(e.ry+.5)*T;e.type==='g'?gor(X,Y,T*1.15,e.talk,false,e.sv):slime(X,Y,T)}
  const X=ox+(p.rx+.5)*T,Y=oy+(p.ry+.5)*T,dead=state==='dead';
  if(!(grace>0&&state==='play'&&Math.sin(t*30)>0))boy(X,Y,T*.95,p.face,p.walk,dead?tm*-9:0);
  if(fog){const r=S.vis*T,gr=ctx.createRadialGradient(X,Y,r*.45,X,Y,r);gr.addColorStop(0,'rgba(0,0,10,0)');gr.addColorStop(1,'rgba(0,0,10,.72)');ctx.fillStyle=gr;ctx.fillRect(0,HUD-4,W,H)}
  ctx.fillStyle='rgba(10,10,30,.8)';ctx.fillRect(0,0,W,HUD-4);
  txt(stageI===5?'★ スペシャル ★':`ステージ ${stageI+1}`,16,26,26,stageI===5?'#ffd23f':'#fff','#000','left');
  txt(`★ ${S.got} / ${S.items.length}`,W/2,26,28,'#ffe066');
  txt('♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives)),W-16,26,30,'#ff4d6d','#000','right');
  if(S.flash>0)txt('ゴールがひらいた!',W/2,H-34,34,'#fff','#e6492d')}
function banner(a,b,c){ctx.fillStyle='rgba(10,10,40,.72)';ctx.fillRect(0,H/2-95,W,190);txt(a,W/2,H/2-45,54,'#ffd23f');txt(b,W/2,H/2+18,28);if(c)txt(c,W/2,H/2+60,22,'#9be7ff')}
function drawTitle(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b2a6b');g.addColorStop(1,'#3a1c71');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){ctx.globalAlpha=.4+.6*Math.abs(Math.sin(t*2+i));ctx.fillStyle='#fff';ctx.fillRect((i*137)%W,(i*71)%H,3,3)}ctx.globalAlpha=1;
  const s='めいろ大冒険';[...s].forEach((ch,i)=>txt(ch,W/2+(i-2.5)*110,150+Math.sin(t*3+i)*10,100,`hsl(${(t*60+i*50)%360},90%,62%)`,'#1a1040'));
  txt('★をあつめて ゴールをめざせ!',W/2,250,32);
  boy(W/2-190,400,150,'d',t*.6);gor(W/2+190,395,150,Math.sin(t*1.2)>.85?1:0,false,true);
  for(let i=0;i<3;i++)star(W/2-60+i*60,400+Math.sin(t*4+i)*10,24,'#ffd23f');
  txt('クリック / Enter で スタート',W/2,520+Math.sin(t*5)*4,36,'#fff');txt('ライフは3つ! 敵やトゲに気をつけよう',W/2,566,20,'#9be7ff')}
function drawEnding(){
  const g=ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,600);g.addColorStop(0,`hsl(${t*30%360},70%,35%)`);g.addColorStop(1,'#0b0626');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<16;i++)star(W/2+Math.cos(t+i*.4)*(120+i*22),H/2+Math.sin(t*1.3+i)*(80+i*12),8+i%3*4,`hsl(${i*25},100%,65%)`);
  const s1='ぜんぶクリア!';[...s1].forEach((ch,i)=>txt(ch,W/2+(i-3)*88,110+Math.sin(t*4+i)*14,84,`hsl(${(t*120+i*45)%360},95%,62%)`,'#1a1040'));
  txt('おめでとう!!  きみは めいろマスターだ!',W/2,205,38,'#fff','#c2185b');
  boy(W/2-120,420+Math.abs(Math.sin(t*5))*-40,200,'d',t*.5,0,true);
  gor(W/2+150,415,200,0,true,true);
  if(tm>4)txt('クリックで タイトルへ',W/2,566,26,'#9be7ff')}
function render(){
  if(state==='title')drawTitle();
  else if(state==='ending')drawEnding();
  else{drawGame();
    if(state==='ready'){const sp=stageI===5;banner(sp?'★ スペシャルコース ★':`ステージ ${stageI+1}`,retry?`のこりライフ ${lives}  もういちど!`:`★を ${S.items.length}こ あつめて ゴールへ!`,!retry&&stageI===0?'まわりしか みえないよ! ゴリラの こえを きいて にげよう':(!retry&&sp?'さいごの せかい! がんばれ!':''))}
    else if(state==='dead')txt('いたっ!',W/2,H/2,80,'#ffd23f','#c0392b');
    else if(state==='clear'){ctx.fillStyle='rgba(10,10,40,.45)';ctx.fillRect(0,HUD-4,W,H);
      txt(`ステージ ${stageI+1} クリア!`,W/2,H/2-40,70,`hsl(${t*150%360},95%,62%)`);
      txt(stageI===4?'つぎは…? とくべつな コースが あらわれた!':'おめでとう! よくできました!',W/2,H/2+30,30);
      if(tm>2)txt('クリック / Enter で つぎへ',W/2,H/2+90,26,'#9be7ff')}
    else if(state==='over'){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);txt('ゲームオーバー',W/2,H/2-30,80,'#ff6b6b');txt('また ちょうせんしてね!',W/2,H/2+50,32);if(tm>1.2)txt('クリック / Enter で タイトルへ',W/2,H/2+110,24,'#9be7ff')}}
  fxDraw()}
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);if(state==='title')t+=0;render();requestAnimationFrame(loop)})(last);
</script></body></html>
